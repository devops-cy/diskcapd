[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diskcapd"
version = "1.0.0"
description = "Local filesystem capacity monitor"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
diskcapd = "diskcapd.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diskcapd = ["templates/*.html"]
