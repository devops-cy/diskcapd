<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>diskcapd filesystem notification</title>
  <style>
    body {
      margin: 0;
      padding: 14px;
      background: #f5f7f9;
      color: #20252b;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      line-height: 1.35;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #dfe3e8;
      border-radius: 6px;
      overflow: hidden;
    }

    .header {
      padding: 14px 20px;
      background: #334155;
      color: #ffffff;
    }

    .brand {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
    }

    .subtitle {
      margin-top: 2px;
      color: #d7dde5;
      font-size: 12px;
    }

    .content {
      padding: 16px 20px 18px;
    }

    .host {
      margin-bottom: 10px;
      font-size: 14px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.3px;
    }

    .badge-alert {
      background: #fff1f0;
      color: #a61b1b;
      border: 1px solid #f0b7b3;
    }

    .badge-reminder {
      background: #fff8e6;
      color: #7a5200;
      border: 1px solid #e4cd96;
    }

    .badge-recovery {
      background: #edf8ef;
      color: #206a31;
      border: 1px solid #b8ddc0;
    }

    h2 {
      margin-top: 17px;
      margin-bottom: 6px;
      font-size: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
    }

    th {
      text-align: left;
      background: #f1f3f5;
      color: #4b5563;
      font-size: 11px;
      padding: 6px 7px;
      border-bottom: 1px solid #d9dee3;
      white-space: nowrap;
    }

    td {
      padding: 6px 7px;
      border-bottom: 1px solid #e8ebee;
      vertical-align: top;
      font-size: 12px;
    }

    .status-ok {
      color: #206a31;
      font-weight: 700;
    }

    .status-alert,
    .status-violation {
      color: #a61b1b;
      font-weight: 700;
    }

    .footer {
      padding: 9px 20px;
      background: #f7f8f9;
      color: #737b84;
      font-size: 11px;
      border-top: 1px solid #e1e5e8;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">diskcapd</div>
      <div class="subtitle">Local filesystem capacity monitor</div>
    </div>

    <div class="content">
      <div class="host">
        Host: <strong>@@HOSTNAME@@</strong>
      </div>

      <span class="badge @@BADGE_CLASS@@">@@EVENT_LABEL@@</span>

      <h2>Event details</h2>

      <table>
        <thead>
          <tr>
            <th>Mount</th>
            <th>Condition</th>
            <th>Used</th>
            <th>Threshold</th>
          </tr>
        </thead>
        <tbody>
          @@EVENT_ROWS@@
        </tbody>
      </table>

      <h2>Filesystem status</h2>

      <table>
        <thead>
          <tr>
            <th>Mount</th>
            <th>Device</th>
            <th>Type</th>
            <th>Size</th>
            <th>Used</th>
            <th>Available</th>
            <th>Use</th>
            <th>Limit</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          @@FILESYSTEM_ROWS@@
        </tbody>
      </table>
    </div>

    <div class="footer">
      Generated by diskcapd @@VERSION@@
    </div>
  </div>
</body>
</html>
